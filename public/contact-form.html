<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Contact | Valley Design Build</title>
  </head>
  <body>
    <!-- Static field declaration required for Netlify's deploy-time form detection. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="contact" type="hidden" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" type="email" />
      <input name="service" />
      <input name="city" />
      <textarea name="message"></textarea>
    </form>
    <p><a href="/contact">Contact Valley Design Build</a></p>
  </body>
</html>
